name: iOS App Store & TestFlight CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios_testflight.yml'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to Apple TestFlight'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy-ios:
    name: Build & Deploy iOS to TestFlight
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Automated Test Suite
        run: flutter test

      # ----------------------------------------------------
      # Apple Code Signing Setup (via GitHub Secrets)
      # ----------------------------------------------------
      - name: Configure Apple Signing Certificate & Profile
        id: setup_signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Apple Distribution Certificate and Provisioning Profile detected in Secrets."
            
            # Create variables
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PWD=${KEYCHAIN_PASSWORD:-"temporary_keychain_password_123"}

            # Decode base64 secrets to files
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            # Create and configure temporary keychain
            security create-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH

            # Import certificate to keychain
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

            # Install provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "No Apple distribution certificate provided in GitHub Secrets. Building unsigned release archive."
            echo "has_signing=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------
      # Build iOS Release
      # ----------------------------------------------------
      - name: Build iOS App Store Package (IPA)
        run: |
          if [ "${{ steps.setup_signing.outputs.has_signing }}" = "true" ]; then
            echo "Building signed release IPA for App Store..."
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          else
            echo "Building release iOS bundle (codesign on upload or manual profile)..."
            flutter build ios --release --no-codesign
            mkdir -p build/ios/ipa
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r ../ipa/WincoConnect.ipa Payload
            cd ../../..
          fi

      # ----------------------------------------------------
      # Upload Artifact to GitHub (Downloadable IPA)
      # ----------------------------------------------------
      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: winco-connect-ios-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # ----------------------------------------------------
      # Deploy to Apple TestFlight (Automated)
      # ----------------------------------------------------
      - name: Upload to Apple TestFlight
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_testflight == 'true') || (github.event_name == 'push') }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "App Store Connect API credentials found! Uploading to TestFlight..."
            
            # Find IPA file
            IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
            echo "IPA file: $IPA_FILE"

            # Create private key directory for xcrun altool
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

            # Upload using xcrun altool
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
            
            echo "Successfully uploaded to Apple TestFlight!"
          else
            echo "App Store Connect API Secrets not configured yet. IPA has been archived as a GitHub release artifact."
            echo "Please set APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APP_STORE_CONNECT_PRIVATE_KEY in GitHub Secrets to enable automatic TestFlight upload."
          fi
