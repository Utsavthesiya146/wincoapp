name: iOS App Store & TestFlight CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios_testflight.yml'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to Apple TestFlight'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy-ios:
    name: Build & Deploy iOS to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Automated Test Suite
        run: flutter test

      # ----------------------------------------------------
      # Apple Code Signing Setup (via GitHub Secrets)
      # ----------------------------------------------------
      - name: Configure Apple Signing Certificate & Profile
        id: setup_signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 1. Install Provisioning Profile (from repo or secrets)
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Decoding provisioning profile from GitHub Secrets..."
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          elif [ -f "ios/Winco_Connect.mobileprovision" ]; then
            echo "Using committed ios/Winco_Connect.mobileprovision..."
            cp ios/Winco_Connect.mobileprovision $PP_PATH
          fi

          if [ -f "$PP_PATH" ]; then
            UUID="47256f58-2188-4885-88f0-e56d8edb7906"
            PARSED_UUID=$(grep -a -A1 "UUID" "$PP_PATH" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -n 1 || echo "")
            if [ -n "$PARSED_UUID" ]; then
              UUID="$PARSED_UUID"
            fi
            echo "Provisioning Profile UUID: $UUID"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          fi

          # 2. Configure Keychain and Certificate (if provided)
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Apple Distribution Certificate detected in Secrets."
            
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PWD=${KEYCHAIN_PASSWORD:-"temporary_keychain_password_123"}
            P12_PWD=${P12_PASSWORD:-""}

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

            security create-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -P "$P12_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" $KEYCHAIN_PATH || true
            security default-keychain -s $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

            echo "has_signing=true" >> $GITHUB_OUTPUT
          else
            echo "No Apple distribution certificate provided in GitHub Secrets."
            echo "has_signing=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------
      # Build iOS Release & Export Signed IPA
      # ----------------------------------------------------
      - name: Build iOS App Store Package (IPA)
        run: |
          echo "Building iOS Release bundle with Flutter..."
          flutter build ios --release --no-codesign

          echo "Archiving iOS Release with xcodebuild..."
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            archive \
            DEVELOPMENT_TEAM=VX698YBG86 \
            CODE_SIGNING_ALLOWED=NO

          echo "Unlocking keychain for signing..."
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security unlock-keychain -p "temporary_keychain_password_123" $RUNNER_TEMP/app-signing.keychain-db || true
          fi

          echo "Exporting signed App Store IPA with xcodebuild..."
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates

          echo "Listing generated IPA files:"
          ls -la build/ios/ipa/

          # Verify signature of exported IPA
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            echo "Verifying code signature of $IPA_FILE..."
            mkdir -p $RUNNER_TEMP/verify_payload
            unzip -q "$IPA_FILE" -d $RUNNER_TEMP/verify_payload
            codesign -dvvv $RUNNER_TEMP/verify_payload/Payload/Runner.app 2>&1 | head -n 25 || true
          fi

      # ----------------------------------------------------
      # Upload Artifact to GitHub (Downloadable IPA)
      # ----------------------------------------------------
      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: winco-connect-ios-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # ----------------------------------------------------
      # Deploy to Apple TestFlight (Automated)
      # ----------------------------------------------------
      - name: Upload to Apple TestFlight
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_testflight == 'true') || (github.event_name == 'push') }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "App Store Connect API credentials found! Uploading to TestFlight..."
            
            # Find IPA file
            IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
            echo "Target IPA file: $IPA_FILE"

            # Create private key directory for xcrun altool
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys ./private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/
            cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ./private_keys/
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ./private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

            # Upload using xcrun altool
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --show-progress
            
            echo "Successfully uploaded to Apple TestFlight!"
          else
            echo "Error: App Store Connect API Secrets not configured."
            exit 1
          fi
